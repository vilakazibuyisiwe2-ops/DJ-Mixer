<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voltage Deck — Dual Channel Mixer</title>
<link rel="stylesheet" href="dj-mixer.css" />
</head>
<body>

<div id="voltage-deck">

  <header class="rack-plate">
    <div class="brand">
      <span class="brand-name">Voltage Deck</span>
      <span class="brand-mark">MK.2</span>
    </div>
    <div class="power">
      <span class="led" aria-hidden="true"></span>
      <span class="power-label">Signal Path Active</span>
    </div>
  </header>

  <div class="console">

    <!-- Channel 1 -->
    <section class="channel" data-channel="a" style="--accent: var(--amber);">
      <div class="channel-head">
        <span class="channel-id">CH.1</span>
        <span class="track-name" id="track-name-a">Demo Loop — Pulse</span>
      </div>

      <div class="scope-frame">
        <canvas class="scope" id="scope-a" width="280" height="78" aria-label="Channel 1 waveform, click to seek"></canvas>
      </div>
      <div class="time-row">
        <span id="time-a">0:00</span>
        <span id="dur-a">0:00</span>
      </div>

      <div class="controls-row">
        <div class="knob-group">
          <div class="knob" id="knob-gain-a" role="slider" tabindex="0" aria-label="Channel 1 gain" aria-valuemin="0" aria-valuemax="150" aria-valuenow="100">
            <div class="knob-pointer"></div>
          </div>
          <label>Gain</label>
        </div>
        <div class="knob-group">
          <div class="knob" id="knob-tempo-a" role="slider" tabindex="0" aria-label="Channel 1 tempo" aria-valuemin="70" aria-valuemax="130" aria-valuenow="100">
            <div class="knob-pointer"></div>
          </div>
          <label>Tempo</label>
        </div>
        <div class="platter" id="platter-a" aria-hidden="true">
          <div class="platter-notch"></div>
        </div>
      </div>

      <div class="transport-row">
        <button class="btn-load" id="load-a" aria-label="Load track on channel 1">Load</button>
        <input type="file" id="file-a" accept="audio/*" hidden />
        <button class="btn-play" id="play-a" aria-label="Play channel 1">&#9654;</button>
      </div>

      <div class="fader-row">
        <div class="vu-meter" id="vu-a" aria-hidden="true"><div class="vu-fill"></div></div>
        <div class="fader-track">
          <input class="fader" id="fader-a" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Channel 1 volume" />
        </div>
      </div>
    </section>

    <!-- Master -->
    <section class="master">
      <span class="master-label">Master</span>
      <div class="master-vu" id="vu-master" aria-hidden="true"><div class="vu-fill"></div></div>
      <div class="knob-group">
        <div class="knob" id="knob-master" role="slider" tabindex="0" aria-label="Master output" aria-valuemin="0" aria-valuemax="120" aria-valuenow="90">
          <div class="knob-pointer"></div>
        </div>
        <label>Output</label>
      </div>
    </section>

    <!-- Channel 2 -->
    <section class="channel" data-channel="b" style="--accent: var(--teal);">
      <div class="channel-head">
        <span class="channel-id">CH.2</span>
        <span class="track-name" id="track-name-b">Demo Loop — Offbeat</span>
      </div>

      <div class="scope-frame">
        <canvas class="scope" id="scope-b" width="280" height="78" aria-label="Channel 2 waveform, click to seek"></canvas>
      </div>
      <div class="time-row">
        <span id="time-b">0:00</span>
        <span id="dur-b">0:00</span>
      </div>

      <div class="controls-row">
        <div class="knob-group">
          <div class="knob" id="knob-gain-b" role="slider" tabindex="0" aria-label="Channel 2 gain" aria-valuemin="0" aria-valuemax="150" aria-valuenow="100">
            <div class="knob-pointer"></div>
          </div>
          <label>Gain</label>
        </div>
        <div class="knob-group">
          <div class="knob" id="knob-tempo-b" role="slider" tabindex="0" aria-label="Channel 2 tempo" aria-valuemin="70" aria-valuemax="130" aria-valuenow="100">
            <div class="knob-pointer"></div>
          </div>
          <label>Tempo</label>
        </div>
        <div class="platter" id="platter-b" aria-hidden="true">
          <div class="platter-notch"></div>
        </div>
      </div>

      <div class="transport-row">
        <button class="btn-load" id="load-b" aria-label="Load track on channel 2">Load</button>
        <input type="file" id="file-b" accept="audio/*" hidden />
        <button class="btn-play" id="play-b" aria-label="Play channel 2">&#9654;</button>
      </div>

      <div class="fader-row">
        <div class="vu-meter" id="vu-b" aria-hidden="true"><div class="vu-fill"></div></div>
        <div class="fader-track">
          <input class="fader" id="fader-b" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Channel 2 volume" />
        </div>
      </div>
    </section>

  </div>

  <div class="crossfader-deck">
    <span class="xf-label xf-a">A</span>
    <input type="range" id="crossfader" min="-1" max="1" step="0.01" value="0" aria-label="Crossfader" />
    <span class="xf-label xf-b">B</span>
  </div>

  <div class="footer-note">Drag the crossfader to blend · Load your own tracks · Scopes scan live</div>

</div>

<script src="dj-mixer.js"></script>
</body>
</html>
